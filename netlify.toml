# Netlify build configuration.
#
# Added during the Astro migration because the publish directory MOVED: the old
# Vite build emitted to dist/public, Astro emits to dist. That setting lived
# only in the Netlify UI, where it is invisible to code review and easy to miss
# during a cutover — a deploy with the stale path publishes an empty directory
# and takes the site down. Declaring it here makes the build reproducible from
# the repo and lets the change land in the same commit as the migration.
#
# Note: settings configured in the Netlify UI take precedence for some fields.
# If a deploy publishes the wrong directory, clear the UI override so this file
# is authoritative.

[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  # Astro 7 declares engines.node ">=22.12.0", so the major alone is not a
  # sufficient guarantee — Netlify resolves "22" to the latest 22.x, which is
  # well past 22.12, but pinning the floor explicitly means a build failure
  # here reads as a version problem rather than an unexplained crash.
  NODE_VERSION = "22.12.0"

# _redirects and _headers are committed under public/ and copied into dist by
# Astro, so redirect and caching rules stay in their existing files rather than
# being split across two mechanisms.
